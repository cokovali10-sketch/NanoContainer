name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: GOOS=linux GOARCH=amd64 go build -o nanocontainer ./cmd/nanocontainer
      - name: Vet
        run: go vet ./...
      - name: Unit Tests
        run: go test -v -short ./...
      - name: Integration Tests
        run: go test -v -run Integration ./...
        if: github.event_name == 'push'

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o nanocontainer-linux-amd64 ./cmd/nanocontainer
      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o nanocontainer-linux-arm64 ./cmd/nanocontainer
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nanocontainer-linux-amd64
            nanocontainer-linux-arm64
